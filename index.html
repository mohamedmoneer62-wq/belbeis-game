<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رالي بلبيس - العاشر</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #121212; color: #fff; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 20px; border: 2px solid #ff9800; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ff9800; margin-top: 0; font-size: 24px; }
        
        .map-box { background: #2a2a2a; padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px dashed #555; }
        .road { height: 12px; background: #444; border-radius: 6px; position: relative; margin: 30px 0 10px 0; }
        .car { position: absolute; right: 0%; top: -14px; font-size: 26px; transition: 0.5s ease; }
        .landmarks { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; font-weight: bold; }

        .card { background: #2c2c3e; border: 2px solid #ff9800; border-radius: 15px; padding: 20px; margin: 20px 0; min-height: 130px; display: flex; flex-direction: column; justify-content: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .card-title { font-size: 19px; font-weight: bold; color: #ffca28; margin-bottom: 8px; }
        .card-desc { font-size: 14px; color: #ddd; line-height: 1.5; }

        .btn-play { background: #e65100; color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; box-shadow: 0 4px 10px rgba(230,81,0,0.4); }
        .btn-play:active { transform: scale(0.98); }
        .btn-share { background: #25D366; color: white; border: none; padding: 12px; font-size: 15px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .ad-banner { margin-top: 15px; padding: 10px; background: #252525; border-radius: 8px; font-size: 12px; color: #888; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚗 رالي بلبيس - العاشر</h2>
    <p style="font-size: 13px; color: #ccc;">تحدى زحمة طريق الشرقية ووصل عربيتك أول واحد!</p>

    <div class="map-box">
        <div class="road">
            <div class="car" id="myCar">🏎️</div>
        </div>
        <div class="landmarks">
            <span>🏁 العاشر</span>
            <span>ميدان الطيارة</span>
            <span>الكوبري العلوي</span>
            <span>📍 بلبيس</span>
        </div>
        <p style="margin-top: 12px; font-weight: bold; font-size: 14px;">المسافة: <span id="dist" style="color:#ff9800;">0</span> / 100 كم</p>
    </div>

    <div class="card">
        <div class="card-title" id="cTitle">جاهز للانطلاق؟</div>
        <div class="card-desc" id="cDesc">اضغط على الزر بالأسفل لسحب الكارت الأول وتحرك في طريق بلبيس!</div>
    </div>

    <button class="btn-play" onclick="drawCard()">🎲 اسحب كارت وتحرك</button>
    <button class="btn-share" onclick="shareWhatsapp()">📲 تحدى أصحابك على الواتساب</button>

    <div class="ad-banner">
        📢 مساحة إعلانية مخصصة (للأرباح المستقبلية والرعاة)
    </div>
</div>

<script>
    let pos = 0;
    const cards = [
        { title: "طريق خالي على مفيش! 🟢", desc: "الدنيا سالكة قدامك ومفيش تكاتك.. تقدم 20 كم", move: 20 },
        { title: "زحمة الكوبري العلوي ببلبيس! 🚨", desc: "التكاتك قفلت الطلعة والنازل.. اتعطلت ورجعت 10 كم", move: -10 },
        { title: "سائق ميكروباص طائر! ⚡", desc: "خدك غرزة وعدى الزحمة بجدارة.. تقدم 30 كم", move: 30 },
        { title: "وقفة عند ميدان الطيارة (العدلية)! ⏳", desc: "الميدان واقف خالص والعسكري موقفك.. هتقف دورك ده (0 كم)", move: 0 },
        { title: "سلكت من طريق غيط جانبي! 🚜", desc: "هربت من الزحمة وسلكت سكة زراعية.. تقدم 15 كم", move: 15 }
    ];

    function drawCard() {
        if (pos >= 100) {
            alert("🎉 مبروك! وصلت لمدينة العاشر من رمضان بسلام وبقيت بطل الطريق!");
            pos = 0;
        }
        let c = cards[Math.floor(Math.random() * cards.length)];
        document.getElementById("cTitle").innerText = c.title;
        document.getElementById("cDesc").innerText = c.desc;
        
        pos += c.move;
        if (pos < 0) pos = 0;
        if (pos > 100) pos = 100;

        document.getElementById("dist").innerText = pos;
        document.getElementById("myCar").style.right = (pos * 0.88) + "%";
    }

    function shareWhatsapp() {
        let text = encodeURIComponent("أنا قطعت " + pos + " كم في لعبة رالي بلبيس - العاشر! تقدر تتحداني وتوصل قبلي؟ 🚗💨");
        window.open("https://api.whatsapp.com/send?text=" + text);
    }
</script>

</body>
</html>
