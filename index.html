<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>سباق طريق بلبيس - العاشر 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Overlay */
        #ui { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .hud-card { background: rgba(0,0,0,0.7); border: 2px solid #ff9800; color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 18px; font-weight: bold; }
        
        #controls { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 20px; }
        .control-btn { background: rgba(255,152,0,0.8); border: none; color: white; width: 80px; height: 80px; border-radius: 50%; font-size: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .control-btn:active { transform: scale(0.9); background: #e65100; }
        
        #game-over { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); color: white; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #game-over h1 { color: #f44336; font-size: 36px; margin-bottom: 10px; }
        #restart-btn { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div class="hud-card">🏎️ السرعة: <span id="speed">100</span> كم/س</div>
        <div class="hud-card">📍 المسافة: <span id="score">0</span> م</div>
    </div>

    <div id="controls">
        <button class="control-btn" onclick="moveLeft()">◀</button>
        <button class="control-btn" onclick="moveRight()">▶</button>
    </div>

    <div id="game-over">
        <h1>لبست في الميكروباص! 💥</h1>
        <p>عملت حادثة على طريق بلبيس</p>

        <p style="font-size: 20px;">المسافة التي قطعتها: <span id="final-score">0</span> متر</p>
        <button id="restart-btn" onclick="restartGame()">إعادة المحاولة 🔄</button>
    </div>

    <div id="canvas-container"></div>

<script>
    let scene, camera, renderer;
    let playerCar, road, buildings = [];
    let trafficCars = [];
    let score = 0, speed = 0.8;
    let currentLane = 0; // -1: left, 0: center, 1: right
    let targetX = 0;
    let isGameOver = false;

    const lanes = [-2.5, 0, 2.5];

    function init() {
        // Scene setup
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky color
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        // Camera setup
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);
        camera.lookAt(0, 1, -5);

        // Renderer setup
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Create Road & Environment
        createRoad();
        createBuildings();

        // Create Player Car
        playerCar = createCarMesh(0x2196F3); // Blue car
        playerCar.position.set(0, 0.5, 0);
        scene.add(playerCar);

        // Spawn Initial Traffic
        for(let i = 0; i < 4; i++) {
            spawnTraffic(-20 - (i * 25));
        }

        // Key Controls
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if(e.key === 'ArrowRight' || e.key === 'd') moveRight();
        });

        window.addEventListener('resize', onWindowResize);

        animate();
    }

    function createRoad() {
        // Road Asphalt
        const roadGeo = new THREE.PlaneGeometry(10, 200);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -80;
        scene.add(road);

        // Road Lines
        for(let i = -180; i < 20; i += 8) {
            const lineGeo = new THREE.PlaneGeometry(0.2, 4);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            const lineLeft = new THREE.Mesh(lineGeo, lineMat);
            lineLeft.rotation.x = -Math.PI / 2;
            lineLeft.position.set(-1.25, 0.01, i);
            scene.add(lineLeft);

            const lineRight = new THREE.Mesh(lineGeo, lineMat);
            lineRight.rotation.x = -Math.PI / 2;
            lineRight.position.set(1.25, 0.01, i);
            scene.add(lineRight);
        }
    }

    function createBuildings() {
        for(let i = -180; i < 20; i += 15) {
            // Left Building (Red brick style)
            let bLeft = new THREE.Mesh(
                new THREE.BoxGeometry(6, Math.random() * 8 + 6, 10),
                new THREE.MeshLambertMaterial({ color: 0xb71c1c })
            );
            bLeft.position.set(-9, bLeft.geometry.parameters.height/2, i);
            scene.add(bLeft);

            // Right Building
            let bRight = new THREE.Mesh(
                new THREE.BoxGeometry(6, Math.random() * 8 + 6, 10),
                new THREE.MeshLambertMaterial({ color: 0x8d6e63 })
            );
            bRight.position.set(9, bRight.geometry.parameters.height/2, i);
            scene.add(bRight);
        }
    }

    function createCarMesh(colorHex) {
        const group = new THREE.Group();
        
        // Body
        const bodyGeo = new THREE.BoxGeometry(1.6, 0.7, 3);
        const bodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.35;
        group.add(body);

        // Roof
        const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.5);
        const cabinMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 0.85, -0.2);
        group.add(cabin);

        return group;
    }

    function spawnTraffic(zPos) {
        const laneIndex = Math.floor(Math.random() * 3);
        const carColors = [0xe53935, 0x43a047, 0xfdd835, 0x8e24aa];
        const randomColor = carColors[Math.floor(Math.random() * carColors.length)];

        let tCar = createCarMesh(randomColor);
        tCar.position.set(lanes[laneIndex], 0.5, zPos);
        scene.add(tCar);
        trafficCars.push(tCar);
    }

    function moveLeft() {
        if (currentLane > -1 && !isGameOver) {
            currentLane--;
            targetX = lanes[currentLane + 1];
        }
    }

    function moveRight() {
        if (currentLane < 1 && !isGameOver) {
            currentLane++;
            targetX = lanes[currentLane + 1];
        }
    }

    function animate() {
        if (isGameOver) return;

        requestAnimationFrame(animate);

        // Smooth Car Lane Change
        playerCar.position.x += (targetX - playerCar.position.x) * 0.2;

        // Move Traffic & Game Loop
        score += 1;
        document.getElementById('score').innerText = Math.floor(score / 5);

        trafficCars.forEach((tCar) => {
            tCar.position.z += speed;

            // Check Collision
            let dx = Math.abs(playerCar.position.x - tCar.position.x);
            let dz = Math.abs(playerCar.position.z - tCar.position.z);

            if (dx < 1.4 && dz < 2.5) {
                endGame();
            }

            // Respawn Traffic behind
            if (tCar.position.z > 10) {
                tCar.position.z = -100 - Math.random() * 20;
                const laneIndex = Math.floor(Math.random() * 3);
                tCar.position.x = lanes[laneIndex];
            }
        });

        renderer.render(scene, camera);
    }

    function endGame() {
        isGameOver = true;
        document.getElementById('final-score').innerText = Math.floor(score / 5);
        document.getElementById('game-over').style.display = 'flex';
    }

    function restartGame() {
        isGameOver = false;
        score = 0;
        currentLane = 0;
        targetX = 0;
        playerCar.position.x = 0;
        
        trafficCars.forEach((tCar, idx) => {
            tCar.position.z = -30 - (idx * 25);
        });

        document.getElementById('game-over').style.display = 'none';
        animate();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
</script>
</body>
</html>
